{% extends 'base.html' %}

{% block content %}
<div class="row mt-4">
    <!-- Status Update Feed -->
    <div class="col-md-8">
        <h4 class="mb-3">Home Feed</h4>
        {% for update in updates %}
            <div class="card mb-3 shadow-sm">
                <div class="card-body">
                    <h6 class="text-muted">{{ update.user.username }} - {{ update.created_at|date:"M d, Y H:i" }}</h6>
                    <p class="mb-0">{{ update.content }}</p>
                </div>
            </div>
        {% empty %}
            <p>No status updates yet. Be the first to post!</p>
        {% endfor %}
    </div>
    <!-- Post Update Box -->
    <div class="col-md-4">
        <div class="card shadow-sm border-primary">
            <div class="card-body">
                <h5 class="card-title">Post an Update</h5>
                <form method="POST">
                    {% csrf_token %}
                    <textarea name="content" class="form-control mb-3" rows="3" placeholder="What's on your mind?" required></textarea>
                    <button type="submit" class="btn btn-primary w-100">Post</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
